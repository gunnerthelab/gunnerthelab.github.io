name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Mint a short-lived GitHub App installation token instead of a PAT. Classic and
      # fine-grained PATs silently expire and then fail with a misleading "API rate limit
      # exceeded" error - exactly what broke this workflow between 2026-08-17 and
      # 2026-09-01 (AB#7974). App tokens are minted per run and cannot lapse.
      - name: Mint a GitHub App token for gunner-content
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: gunnerthelab
          repositories: gunner-content

      - name: Checkout gunner-content (private, source of truth for stories)
        uses: actions/checkout@v4
        with:
          repository: gunnerthelab/gunner-content
          token: ${{ steps.app-token.outputs.token }}
          path: gunner-content

      - name: Sync stories + images from gunner-content
        run: |
          set -euo pipefail
          rm -rf src/content/stories
          mkdir -p src/content/stories
          cp gunner-content/stories/*.md src/content/stories/

          mkdir -p public/images/covers public/images/stories
          rm -rf public/images/covers/* public/images/stories/*
          cp -r gunner-content/images/covers/. public/images/covers/
          cp -r gunner-content/images/stories/. public/images/stories/

          echo "Synced $(ls src/content/stories | wc -l) stories from gunner-content."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
