name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout gunner-content (private, source of truth for stories)
        uses: actions/checkout@v4
        with:
          repository: gunnerthelab/gunner-content
          token: ${{ secrets.GUNNER_CONTENT_PAT }}
          path: gunner-content

      - name: Sync stories + images from gunner-content
        run: |
          set -euo pipefail
          rm -rf src/content/stories
          mkdir -p src/content/stories
          cp gunner-content/stories/*.md src/content/stories/

          mkdir -p public/images/covers public/images/stories
          rm -rf public/images/covers/* public/images/stories/*
          cp -r gunner-content/images/covers/. public/images/covers/
          cp -r gunner-content/images/stories/. public/images/stories/

          echo "Synced $(ls src/content/stories | wc -l) stories from gunner-content."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
